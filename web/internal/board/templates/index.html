{{define "index" -}}
{{template "page-start" "board"}}
    {{if .LoadError -}}
    <section class="load-error" role="alert">
      <p>{{.LoadError}}</p>
      <a class="button" href="/">もういちど</a>
    </section>
    {{- else -}}
    {{template "board" .}}
    {{- end}}
{{template "page-end"}}
{{- end}}
