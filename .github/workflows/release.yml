name: Release

on:
  push:
    branches: [main]

# 連続マージ時にバージョン計算が競合しないよう、リリース処理は直列化する
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 前回タグからのコミット履歴を走査するため全履歴を取得
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail

          latest_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$latest_tag" ]; then
            range="${latest_tag}..HEAD"
            version="${latest_tag#v}"
          else
            range="HEAD"
            version="0.0.0"
          fi

          # Conventional Commits から bump 種別を判定（major > minor > patch）
          bump=""
          while IFS= read -r -d '' commit; do
            subject=$(printf '%s\n' "$commit" | sed -n '1p')
            if printf '%s\n' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
              || printf '%s\n' "$commit" | grep -qE '^BREAKING[ -]CHANGE:'; then
              bump="major"; break
            elif printf '%s\n' "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              bump="minor"
            elif [ -z "$bump" ] && printf '%s\n' "$subject" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
              bump="patch"
            fi
          done < <(git log -z "$range" --format='%B')

          if [ -z "$bump" ]; then
            echo "リリース対象のコミット (feat / fix / perf / 破壊的変更) がないためスキップします"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$version"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"

          echo "${latest_tag:-(none)} -> ${next} (${bump})"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest)
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" "${args[@]}"
