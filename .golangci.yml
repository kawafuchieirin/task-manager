version: "2"

linters:
  default: standard # errcheck / govet / ineffassign / staticcheck / unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      # テストではリクエストのコンテキスト指定や一時ファイル権限を厳密にしなくてよい
      - path: _test\.go
        linters: [noctx, gosec]

formatters:
  enable:
    - gofmt
    - goimports
